if(USE){USE=0;let i=0,v=0;for(const d of[.7,1.1,1.5])for(const o of[0,.35,-.35]){const j=((P.y+Math.sin(P.a+o)*d)|0)*MW+((P.x+Math.cos(P.a+o)*d)|0),u=M[j];if(!v&&(u==9||u==22||u==20||u==21||u==23)){i=j;v=u}}

else if(v==22){M[i]=0;secrets++;msg("SECRET!");play("door")}
else if(v==9){S="tally";tallyT=T/TICK|0;score+=500}}
for(const k in DR){const d=DR[k],x=k%MW,y=k/MW|0,inside=(Math.abs(P.x-x-.5)<.85&&Math.abs(P.y-y-.5)<.85)||E.some(e=>!e.dead&&(e.x|0)==x&&(e.y|0)==y),c=M[k],near=Math.hypot(P.x-x-.5,P.y-y-.5)<1.1;
if(near&&(d.s==0||d.s==3)){const need=c==21?1:c==23?2:0;if(!need||P.keys&need){d.s=1;play("door")}else if(MSG.t==0)msg(c==21?"YOU NEED THE BLUE KEY":"YOU NEED THE RED KEY")}
if(d.s==1){d.o+=DOOR_SPEED;if(d.o>=1){d.o=1;d.s=2;d.t=0}}
else if(d.s==2){if(++d.t>DOOR_WAIT&&!inside)d.s=3}
else if(d.s==3){if(inside)d.s=1;else{d.o-=DOOR_SPEED;if(d.o<=0){d.o=0;d.s=0}}}}
for(const it of IT){if(it.got||Math.hypot(it.x-P.x,it.y-P.y)>.6)continue;let ok=true;
switch(it.n){case"med":if(P.hp<PLAYER_HP){P.hp=Math.min(PLAYER_HP,P.hp+25);P.grin=40}else ok=false;break;
case"bul":P.am.b+=12;break;case"arm":if(P.arm<100){P.arm=Math.min(100,P.arm+50);msg("ARMOR")}else ok=false;break;case"life":lives++;msg("EXTRA LIFE");break;case"shl":P.am.s+=6;break;
case"key":P.keys|=1;msg("GOT THE BLUE KEY");break;case"rkey":P.keys|=2;msg("GOT THE RED KEY");break;
case"gun2":P.has[2]=1;P.am.s+=4;P.w=2;msg("SHOTGUN");break;
case"gun3":P.has[3]=1;P.am.b+=20;P.w=3;msg("RIVET GUN");break;
default:ok=false}
if(ok){it.got=1;play("pick");score+=10}}
for(const e of E)eUpd(e);
for(let i=PR.length-1;i>=0;i--){const q=PR[i];q.x+=q.dx;q.y+=q.dy;if(sol(q.x,q.y))PR.splice(i,1);else if(Math.hypot(q.x-P.x,q.y-P.y)<.4){hurt(5+rnd(6),q);PR.splice(i,1)}}

function ray(rdx,rdy){let mx=P.x|0,my=P.y|0,ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy),sx,sy,sdx,sdy,side=0,c=1,pd=1e3,wx=0,ix=0;
if(rdx<0){sx=-1;sdx=(P.x-mx)*ddx}else{sx=1;sdx=(mx+1-P.x)*ddx}
if(rdy<0){sy=-1;sdy=(P.y-my)*ddy}else{sy=1;sdy=(my+1-P.y)*ddy}
for(let n=0;n<64;n++){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
if(mx<0||my<0||mx>=MW||my>=MH){c=1;pd=1e3;break}
c=M[my*MW+mx];if(!c)continue;
pd=side?sdy-ddy:sdx-ddx;wx=side?P.x+pd*rdx:P.y+pd*rdy;wx-=Math.floor(wx);
if((c==20||c==21||c==23)&&wx<DR[my*MW+mx].o)continue;ix=my*MW+mx;break}
return[pd,side,c,wx,ix]}
function dspr(im,wx,wy,z=1,tn=0){const dx=wx-P.x,dy=wy-P.y,det=pX*dY-dX*pY,tx=(dY*dx-dX*dy)/det,ty=(pX*dy-pY*dx)/det;if(ty<.25)return;
const sc=W/2*(1+tx/ty)|0,sz=VH/ty*z|0,x0=sc-(sz>>1),y0=((VH+VH/ty)/2|0)-sz,lv=Math.min(4,ty/3.5|0);
for(let x=Math.max(0,x0);x<Math.min(W,x0+sz);x++){if(ty>=Z[x])continue;const u=(x-x0)*64/sz|0;
for(let y=Math.max(0,y0);y<Math.min(VH,y0+sz);y++){const c=im[((y-y0)*64/sz|0)*64+u];if(c!=255)buf[y*W+x]=P32[SH[lv][tn?RED[c]:c]]}}}

R(0,0,24,24,d?6:48);R(0,0,24,6,19);R(0,6,3,10,19);R(21,6,3,10,19);
if(d){R(5,9,5,1,1);R(7,8,1,3,1);R(14,9,5,1,1);R(16,8,1,3,1)}else{R(5,9,5,3,9);R(14,9,5,3,9);R(6+lk,10,2,2,1);R(15+lk,10,2,2,1)}
if(P.grin>0&&!d)R(7,17,10,4,9);else R(8,17,8,2,d?1:31);
if(s>0)R(2,12,3,3,32);if(s>1)R(16,4,2,8,32);if(s>2)R(8,19,6,3,32);if(s>3)R(10,0,5,10,32);if(d)R(4,14,2,10,32)}

const w=WR[P.w],lab=(s,x,v,c=37)=>{txt(s,x,165,6);txt(v,x,177,c)};
lab("LEVEL",6,L+1);lab("SCORE",40,score);lab("LIVES",92,lives);lab("HEALTH",186,P.hp+"%",P.hp<30?32:37);lab("AMMO",238,w.a?P.am[w.a]:"-");

function radar(){const X=10,Y=26,N=44,s=3,h=N/2,ca=Math.cos(P.a),sa=Math.sin(P.a);rect(X-1,Y-1,N+2,N+2,1);
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const u=(i-h)/s,v=(h-j)/s;buf[(Y+j)*W+X+i]=P32[sol(P.x-u*sa+v*ca,P.y+u*ca+v*sa)?4:2]}
const dot=(x,y,z,c)=>{const dx=x-P.x,dy=y-P.y,px=h+(-dx*sa+dy*ca)*s,py=h-(dx*ca+dy*sa)*s;if(px>1&&px<N-2&&py>1&&py<N-2)rect(X+px-z/2|0,Y+py-z/2|0,z,z,c)};
for(const e of E)if(!e.dead)dot(e.x,e.y,e.k==2?5:3,e.st=="idle"?35:32);for(const q of PR)dot(q.x,q.y,2,37);

function drawG(){
for(let y=0;y<80;y++)buf.fill(P32[3],y*W,y*W+W);
dX=Math.cos(P.a);dY=Math.sin(P.a);pX=-dY*PLANE;pY=dX*PLANE;
for(let y=80;y<VH;y++){const rd=VH/(2*(y-79.5)),sh=SH[Math.min(4,rd/3.5|0)],sx=rd*2*pX/W,sy=rd*2*pY/W;let fx=P.x+rd*(dX-pX),fy=P.y+rd*(dY-pY);for(let x=0;x<W;x++){buf[y*W+x]=P32[sh[FL[((fy*64&63)<<6)+(fx*64&63)]]];fx+=sx;fy+=sy}}

for(let x=0;x<W;x++){const cx=2*x/W-1,rdx=dX+pX*cx,rdy=dY+pY*cx,[pd,side,c,wx,ix]=ray(rdx,rdy);Z[x]=pd;
const isD=c==20||c==21||c==23,tid=isD?(c==20?4:c==21?5:10):c==22?1:c,t=TX[tid];
let tx=wx*64|0;
if(isD)tx=Math.max(0,Math.min(63,(wx-DR[ix].o)*64|0));
else if((side==0&&rdx>0)||(side==1&&rdy<0))tx=63-tx;
const lh=VH/Math.max(pd,.05)|0,top=VH-lh>>1,y0=Math.max(0,top),y1=Math.min(VH,top+lh),lv=Math.min(4,(pd/3.5|0)+(side?0:1)),st=64/lh;let ty=(y0-top)*st;
for(let y=y0;y<y1;y++){buf[y*W+x]=P32[SH[lv][t[(ty|0)*64+tx]]];ty+=st}}
const SP=[];for(const e of E){const p=e.st=="dead"?4+Math.min(2,e.t/5|0):e.st=="attack"?2:e.st=="pain"?3:e.st=="chase"?(e.t>>3)&1:0;SP.push([ES[e.k][p],e.x,e.y,e.k==2?1.6:e.k==3?1.25:1,e.fl>0])}

SP.sort((a,b)=>((b[1]-P.x)**2+(b[2]-P.y)**2)-((a[1]-P.x)**2+(a[2]-P.y)**2));for(const s of SP)dspr(s[0],s[1],s[2],s[3],s[4]);
if(S=="play"||P.hp>0){const f=P.af?1+Math.min(2,(P.af-1)*3/WR[P.w].r|0):0,im=WS[P.w][f];
for(let y=0;y<64;y++)for(let x=0;x<64;x++){const c=im[y*64+x];if(c!=255){const X=64+x*3,Y=VH-192+y*3+48;if(Y+3>0&&Y<VH)for(let j=0;j<3;j++)for(let i=0;i<3;i++){const yy=Y+j;if(yy>=0&&yy<VH)buf[yy*W+X+i]=P32[c]}}}}

if(P.hp>0&&P.hp<30&&(T>>4&1)){rect(0,0,W,3,32);rect(0,VH-3,W,3,32);rect(0,0,3,VH,32);rect(W-3,0,3,VH,32)}

const ob=OBJ[L][OS];if(ob){const a=Math.atan2(ob[2]-P.y,ob[1]-P.x)-P.a,dd=Math.hypot(ob[1]-P.x,ob[2]-P.y);rect(0,13,W,9,1);ctr(ob[0],14,36);rect(282,24,30,36,1);for(let i=0;i<=10;i++)rect(297+Math.sin(a)*i*1.2-1|0,40-Math.cos(a)*i*1.2-1|0,2,2,i>7?37:33);txt((dd|0)+"M",290,52,8)}

// ---- MAIN LOOP (fixed 35 Hz tick)
let last=performance.now(),acc=0,AL=0;
function loop(t){acc=Math.min(acc+Math.max(0,t-last),100);last=t;while(acc>=1000/TICK){acc-=1000/TICK;tick()}AL=acc*TICK/1000;render();requestAnimationFrame(loop)}
